services:
  #menambahkan service postgre
  postgres-db:
    image: postgres:16-alpine
    container_name: harkat_postgres_container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # -> Sudah diperbaiki (sebelumnya OSTGRES_PASSWORD)
      POSTGRES_DB: harkat_store_db
    ports:
      #format: "portdikomputer:portdicontainer"
      - "5432:5432"
    volumes:
      - postgres_data_volume:/var/lib/postgresql/data # -> Disamakan menggunakan underscore

volumes:
  postgres_data_volume: # -> Disamakan menggunakan underscore
